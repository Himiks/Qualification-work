name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.1
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: smart_student_hub
          MYSQL_USER: appuser
          MYSQL_PASSWORD: apppassword
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout backend code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Wait for MySQL to be ready
        run: |
          echo "Waiting for MySQL..."
          until mysql -h 127.0.0.1 -P 3306 -u appuser -papppassword -e "SELECT 1;" &> /dev/null; do
            sleep 5
          done

      - name: Install backend dependencies
        run: |
          cd BE-Smart_StudentHub
          mvn clean install -DskipTests

      - name: Run backend tests
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/smart_student_hub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: appuser
          SPRING_DATASOURCE_PASSWORD: apppassword
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
        run: |
          cd BE-Smart_StudentHub
          mvn test

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: |
          cd FE-Smart_StudentHub
          npm install

      - name: Run frontend tests
        run: |
          cd FE-Smart_StudentHub
          npx vitest run

  build-and-push:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./BE-Smart_StudentHub
          push: true
          tags: himik487/smart-student-hub-backend:latest

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./FE-Smart_StudentHub
          push: true
          tags: himik487/smart-student-hub-frontend:latest
