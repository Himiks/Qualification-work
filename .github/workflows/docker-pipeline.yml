name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:

  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Run backend tests
        run: |
          cd BE-Smart_StudentHub
          mvn test -Dspring.profiles.active=test

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: |
          cd FE-Smart_StudentHub
          npm install

      - name: Run frontend tests
        run: |
          cd FE-Smart_StudentHub
          npx vitest run

  build-and-push:
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./BE-Smart_StudentHub
          file: ./BE-Smart_StudentHub/Dockerfile
          push: true
          tags: himik487/smart-student-hub-backend:latest

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./FE-Smart_StudentHub
          push: true
          tags: himik487/smart-student-hub-frontend:latest
